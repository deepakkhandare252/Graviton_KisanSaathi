# Kisan Scheme Saathi - Spring Boot Application Configuration
spring.application.name=kisan-scheme-saathi

server.port=8080
server.servlet.context-path=/api

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kisan_saathi_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate (Flyway manages schema migrations safely)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Additive Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT & Security Configuration
kisan.security.jwt-secret=${JWT_SECRET:replace-with-32-plus-byte-random-secret-in-production}
kisan.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:604800000}
kisan.security.otp-secret=${OTP_HMAC_SECRET:replace-with-otp-hmac-secret-in-production}

# Real SMS OTP Provider Configuration (msg91 | twilio | fast2sms)
kisan.sms.provider=${SMS_PROVIDER:}
kisan.sms.msg91.auth-key=${MSG91_AUTH_KEY:}
kisan.sms.msg91.template-id=${MSG91_TEMPLATE_ID:}
kisan.sms.msg91.sender-id=${MSG91_SENDER_ID:KSNSAT}
kisan.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
kisan.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
kisan.sms.twilio.from-number=${TWILIO_FROM_NUMBER:}
kisan.sms.fast2sms.api-key=${FAST2SMS_API_KEY:}
kisan.sms.fast2sms.sender-id=${FAST2SMS_SENDER_ID:KSNSAT}

# Timezone & Deadline Scheduler
kisan.scheduler.timezone=Asia/Kolkata
kisan.scheduler.deadline-cron=0 0/30 * * * *

# Schemes catalog resource path
kisan.schemes.catalog-path=classpath:schemes/karnataka-schemes.json

# Gemini AI API Configuration (Backend Only)
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash

# OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.kisanscheme.saathi=INFO
logging.level.org.springframework.web=INFO
